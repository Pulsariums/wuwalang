name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Sürüm kontrolü
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" = "$GITHUB_REF_NAME"

      - name: Test
        run: cargo test --locked

      - name: Derle
        run: cargo build --release --locked

      - name: SHA256 üret
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          (Get-FileHash target/release/wuwalang.exe -Algorithm SHA256).Hash.ToLower() + "  wuwalang.exe" | Set-Content -NoNewline -Encoding ascii target/release/wuwalang.exe.sha256

      - name: Artifact olarak yükle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wuwalang
          path: target/release/wuwalang.exe

      - name: GitHub Release'e yükle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/wuwalang.exe
            target/release/wuwalang.exe.sha256
          generate_release_notes: true
